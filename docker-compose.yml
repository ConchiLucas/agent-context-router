services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: agent-context-router-backend:local
    restart: unless-stopped
    working_dir: /app/backend
    command: uv run uvicorn context_router.main:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      CONTEXT_ROUTER_RUNTIME_MODE: container
      CONTEXT_ROUTER_WORKSPACE_HOST_ROOT: ${CONTEXT_ROUTER_WORKSPACE_HOST_ROOT:-/Users/conchi/workforce}
      CONTEXT_ROUTER_WORKSPACE_CONTAINER_ROOT: /workspace
      CONTEXT_ROUTER_WORKSPACE_MAPPING_FILE: /app/.context-router/workspaces.local.yaml
      CONTEXT_ROUTER_RUNTIME_ROOT: /runtime
      CONTEXT_ROUTER_RUNTIME_EXECUTION_ENABLED: "true"
      CONTEXT_ROUTER_RUNTIME_EXECUTION_TIMEOUT_SECONDS: ${CONTEXT_ROUTER_RUNTIME_EXECUTION_TIMEOUT_SECONDS:-1800}
      CONTEXT_ROUTER_RUNTIME_RUNNER_API_ENABLED: "true"
      CONTEXT_ROUTER_RUNTIME_RUNNER_TOKEN_PATH: /runtime/runner.token
      CONTEXT_ROUTER_RUNTIME_RUNNER_HEARTBEAT_TTL_SECONDS: ${CONTEXT_ROUTER_RUNTIME_RUNNER_HEARTBEAT_TTL_SECONDS:-30}
      CONTEXT_ROUTER_RUNTIME_RUNNER_LEASE_SECONDS: ${CONTEXT_ROUTER_RUNTIME_RUNNER_LEASE_SECONDS:-30}
      CONTEXT_ROUTER_RUNTIME_DOCKER_SOCKET: /var/run/docker.sock
      CONTEXT_ROUTER_DATABASE_URL: ${CONTEXT_ROUTER_DATABASE_URL:-}
      CONTEXT_ROUTER_PUBLIC_MCP_URL: ${CONTEXT_ROUTER_PUBLIC_MCP_URL:-http://127.0.0.1:49173/mcp}
      CONTEXT_ROUTER_INTERNAL_MCP_URL: http://127.0.0.1:8000/mcp
      CONTEXT_ROUTER_MCP_TEST_TIMEOUT_SECONDS: ${CONTEXT_ROUTER_MCP_TEST_TIMEOUT_SECONDS:-15}
      CONTEXT_ROUTER_SHARED_CONFIG_CENTER_BASE_URL: ${CONTEXT_ROUTER_SHARED_CONFIG_CENTER_BASE_URL:-http://shared-config-center-api:8080}
      CONTEXT_ROUTER_SHARED_CONFIG_CENTER_TIMEOUT_SECONDS: ${CONTEXT_ROUTER_SHARED_CONFIG_CENTER_TIMEOUT_SECONDS:-10}
      CONTEXT_ROUTER_DATABASE_PAYLOAD_REQUEST_BYTES: ${CONTEXT_ROUTER_DATABASE_PAYLOAD_REQUEST_BYTES:-1000000}
      CONTEXT_ROUTER_DATABASE_PAYLOAD_RESPONSE_BYTES: ${CONTEXT_ROUTER_DATABASE_PAYLOAD_RESPONSE_BYTES:-1000000}
      CONTEXT_ROUTER_DATABASE_PAYLOAD_HARD_MAX_BYTES: ${CONTEXT_ROUTER_DATABASE_PAYLOAD_HARD_MAX_BYTES:-4000000}
      CONTEXT_ROUTER_DATABASE_PAYLOAD_TTL_DAYS: ${CONTEXT_ROUTER_DATABASE_PAYLOAD_TTL_DAYS:-7}
      CONTEXT_ROUTER_DATABASE_PAYLOAD_CLEANUP_INTERVAL_SECONDS: ${CONTEXT_ROUTER_DATABASE_PAYLOAD_CLEANUP_INTERVAL_SECONDS:-3600}
    ports:
      - "127.0.0.1:49173:8000"
    volumes:
      - .:/app
      - ${CONTEXT_ROUTER_WORKSPACE_HOST_ROOT:-/Users/conchi/workforce}:/workspace:rw
      - ${CONTEXT_ROUTER_RUNTIME_HOST_ROOT:-./.runtime-runner}:/runtime
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      default: {}
      vibedeploy-shared: {}

  frontend:
    image: node:22-bookworm
    restart: unless-stopped
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      CONTEXT_ROUTER_INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_CONTEXT_ROUTER_API_URL: http://127.0.0.1:49173
    ports:
      - "127.0.0.1:49175:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      - backend

  clickhouse-test:
    image: clickhouse/clickhouse-server:24.8.14.39-alpine
    profiles:
      - integration
    environment:
      CLICKHOUSE_DB: context_router_test
      CLICKHOUSE_USER: context_router_admin
      CLICKHOUSE_PASSWORD: context_router_admin
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user context_router_admin
          --password context_router_admin --query 'SELECT 1'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  frontend_node_modules:

networks:
  vibedeploy-shared:
    name: vibedeploy-shared
    external: true
